services:
  # Banco de Dados Local
  db:
    image: postgres:15-alpine
    container_name: futlist-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: futlist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Back-end API
  futlist-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: futlist-backend
    restart: always
    ports:
      - "3333:3333"
    environment:
      - JWT_SECRET=super_secret_futlist_key
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/futlist_db
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  # Front-end React/Vite
  futlist-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futlist-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - futlist-backend

volumes:
  postgres_data: