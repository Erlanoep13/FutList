services:
  # Banco de Dados
  futlist-db:
    image: postgres:15-alpine
    container_name: futlist-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: futlist_db
    ports:
      - "5432:5432"
    volumes:
      - futlist_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # Back-end API
  futlist-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: futlist-backend
    restart: always
    ports:
      - "3333:3333"
    environment:
      - DB_HOST=futlist-db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=adminpassword
      - DB_NAME=futlist_db
      - JWT_SECRET=super_secret_futlist_key
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - futlist-db

  # Front-end React/Vite
  futlist-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futlist-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - futlist-backend

volumes:
  futlist_pgdata: