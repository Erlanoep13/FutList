services:
  # Back-end API (Conectado ao Supabase na nuvem)
  futlist-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: futlist-backend
    restart: always
    ports:
      - "3333:3333"
    environment:
      - JWT_SECRET=super_secret_futlist_key
      - DATABASE_URL=postgresql://postgres.efpwelhuaelglifegiji:Erlanoroyale13@aws-1-sa-east-1.pooler.supabase.com:6543/postgres
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  # Front-end React/Vite
  futlist-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futlist-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - futlist-backend